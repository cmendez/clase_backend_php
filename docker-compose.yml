version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:8000"
    volumes:
      - .:/var/www/html
    # Inicia el servidor web incorporado de PHP usando index.php como enrutador
    command: php -S 0.0.0.0:8000 index.php
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: mi_app_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Script de inicialización de la BD para que tengan datos listos para el Módulo 4
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
